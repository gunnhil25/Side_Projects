<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Tracker Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1e29 0%, #0d0f14 100%);
      color: #e2e8f0;
      overflow: hidden;
      position: relative;
    }

    /* Fireworks Canvas (behind card or overlay) */
    #fireworks-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .tracker-card {
      position: relative;
      z-index: 20;
      background: rgba(26, 32, 44, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      width: 480px;
      text-align: center;
    }

    h2 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .time-readout {
      font-size: 1.05rem;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      margin-bottom: 24px;
    }

    /* Time Configuration Pickers */
    .controls-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      background: #11141c;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      flex: 1;
    }

    .input-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 600;
    }

    .input-group input[type="time"] {
      width: 100%;
      background: #1e2433;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input[type="time"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    /* Progress Track */
    .progress-track {
      background-color: #0f131a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      height: 28px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    /* Animated Shimmering Progress Bar */
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg, 
        #0284c7 0%, 
        #38bdf8 25%, 
        #818cf8 50%, 
        #38bdf8 75%, 
        #0284c7 100%
      );
      background-size: 200% 100%;
      border-radius: 20px;
      transition: width 0.4s ease;
      animation: shimmer 3s linear infinite;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .percentage-text {
      font-size: 2.2rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }

    /* Celebration Banner */
    .celebration {
      display: none;
      margin-top: 14px;
      font-size: 1.35rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.7);
      animation: bounce 0.8s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-6px) scale(1.05); }
    }
  </style>
</head>
<body>

  <canvas id="fireworks-canvas"></canvas>

  <div class="tracker-card">
    <h2>Workday Tracker</h2>
    <div class="time-readout" id="current-time">Current: --:--:--</div>

    <!-- Time Inputs -->
    <div class="controls-row">
      <div class="input-group">
        <label for="start-time-input">Start Shift</label>
        <input type="time" id="start-time-input" value="07:45">
      </div>
      <div class="input-group">
        <label for="end-time-input">Finish Shift</label>
        <input type="time" id="end-time-input" value="16:30">
      </div>
    </div>

    <!-- Animated Progress Bar -->
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div class="bar-labels">
      <span id="label-start">07:45</span>
      <span id="time-remaining">Calculating...</span>
      <span id="label-end">16:30</span>
    </div>

    <div class="percentage-text" id="percentage">0.0%</div>
    <div>
      <span class="status-badge" id="status-badge">Standby</span>
    </div>

    <!-- Woohoo Celebration Element -->
    <div class="celebration" id="celebration-banner">
      🎉 WOOHOO! WORKDAY COMPLETE! 🎉
    </div>
  </div>

  <script>
    const startInput = document.getElementById("start-time-input");
    const endInput = document.getElementById("end-time-input");
    const progressBar = document.getElementById("progress-bar");
    const percentageText = document.getElementById("percentage");
    const currentTimeText = document.getElementById("current-time");
    const statusBadge = document.getElementById("status-badge");
    const timeRemaining = document.getElementById("time-remaining");
    const celebrationBanner = document.getElementById("celebration-banner");
    const labelStart = document.getElementById("label-start");
    const labelEnd = document.getElementById("label-end");

    // Load saved times from browser storage if present
    if (localStorage.getItem("work_start")) startInput.value = localStorage.getItem("work_start");
    if (localStorage.getItem("work_end")) endInput.value = localStorage.getItem("work_end");

    // Save when user changes them
    startInput.addEventListener("change", () => {
      localStorage.setItem("work_start", startInput.value);
      updateProgress();
    });
    endInput.addEventListener("change", () => {
      localStorage.setItem("work_end", endInput.value);
      updateProgress();
    });

    let fireworksActive = false;

    function parseTimeInput(timeString, baseDate) {
      const [hours, minutes] = timeString.split(":").map(Number);
      const d = new Date(baseDate);
      d.setHours(hours, minutes, 0, 0);
      return d;
    }

    function formatDuration(ms) {
      const totalSec = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      return `${hrs > 0 ? hrs + "h " : ""}${mins}m ${secs}s`;
    }

    function updateProgress() {
      const now = new Date();
      const start = parseTimeInput(startInput.value, now);
      const end = parseTimeInput(endInput.value, now);

      currentTimeText.textContent = `Current: ${now.toLocaleTimeString()}`;
      labelStart.textContent = startInput.value;
      labelEnd.textContent = endInput.value;

      const totalDuration = end - start;
      const elapsed = now - start;

      let percent = (elapsed / totalDuration) * 100;

      if (now < start) {
        percent = 0;
        statusBadge.textContent = "Shift Not Started";
        statusBadge.style.color = "#94a3b8";
        timeRemaining.textContent = `Starts in ${formatDuration(start - now)}`;
        celebrationBanner.style.display = "none";
        fireworksActive = false;
      } else if (now >= end) {
        percent = 100;
        statusBadge.textContent = "Off The Clock";
        statusBadge.style.color = "#4ade80";
        timeRemaining.textContent = "Done for the day!";
        celebrationBanner.style.display = "block";
        if (!fireworksActive) {
          fireworksActive = true;
          launchFireworksLoop();
        }
      } else {
        percent = Math.min(Math.max(percent, 0), 100);
        statusBadge.textContent = "On The Clock ⏳";
        statusBadge.style.color = "#38bdf8";
        timeRemaining.textContent = `${formatDuration(end - now)} remaining`;
        celebrationBanner.style.display = "none";
        fireworksActive = false;
      }

      progressBar.style.width = `${percent.toFixed(2)}%`;
      percentageText.textContent = `${percent.toFixed(1)}%`;
    }

    // --- FIREWORKS CANVAS ENGINE ---
    const canvas = document.getElementById("fireworks-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.01;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.06; // Gravity
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createExplosion(x, y) {
      const colors = ["#facc15", "#38bdf8", "#f43f5e", "#4ade80", "#a855f7", "#fb923c"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    let lastExplosion = 0;
    function renderFireworks(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (fireworksActive && timestamp - lastExplosion > 450) {
        const randX = Math.random() * (canvas.width * 0.7) + (canvas.width * 0.15);
        const randY = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1);
        createExplosion(randX, randY);
        lastExplosion = timestamp;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }

      if (fireworksActive || particles.length > 0) {
        requestAnimationFrame(renderFireworks);
      }
    }

    function launchFireworksLoop() {
      requestAnimationFrame(renderFireworks);
    }

    // Initialize and run tick loop
    updateProgress();
    setInterval(updateProgress, 1000);
  </script>
</body>
</html>
